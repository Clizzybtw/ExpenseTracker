name: Keep API awake

# Render's free tier spins down after 15 minutes idle and takes ~1 minute to
# wake. Pinging 24/7 would exceed the 750 free instance-hours per month, so
# this runs only during waking hours. Adjust the window to your audience.
on:
  schedule:
    - cron: '*/10 6-23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 "${{ secrets.API_URL }}/api/health" || true
